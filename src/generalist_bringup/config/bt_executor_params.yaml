bt_action_server:
  ros__parameters:
    action_name: "/bt_executor/execute_tree"
    tick_frequency: 20
    groot2_port: 1667
    ros_plugins_timeout: 1000
    behavior_trees:
      - "bt_executor/trees"

    # package-level discovery for robot action plugins
    plugin_directories:
      - "robot_actions/lib"

    # robot_actions defaults
    nav2_action_name: "/navigate_to_pose"
    nav2_follow_gps_waypoints_action_name: "/follow_gps_waypoints"
    nav2_goal_frame_id: "target/map"
    waypoint_marker_topic: "/mission_coordinator/waypoint_markers"
    waypoint_marker_map_frame: "target/map"
    waypoint_marker_gps_frame: "target/odom"
    waypoint_marker_from_ll_service: "/fromLL"
    waypoint_marker_conversion_timeout_ms: 2000
    waypoint_marker_line_width: 3.0
    waypoint_marker_arrow_scale_x: 2.5
    waypoint_marker_arrow_scale_y: 1.2
    waypoint_marker_arrow_scale_z: 1.2
    waypoint_marker_label_height: 0.35
    log_temperature_service_name: "/log_temperature"
    take_photo_image_topic: /a200_0000/sensors/camera_0/color/image # "/okvis/rgb2/image_raw"
    get_current_pose_pose_topic: "/pose"
    distance_traveled_odom_topic: /a200_0000/platform/odom/filtered # "/target/odometry/fused"
    get_current_pose_odom_topic: /a200_0000/platform/odom/filtered # "/target/odometry/fused"

    status_topic: "/mission_coordinator/status_text"
    active_node_topic: "/mission_coordinator/active_subtree"
    enable_debug_logging: false
    auto_restart_on_failure: false
    feedback_rate_hz: 5.0
