/**:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 0.5
    two_d_mode: true
    predict_to_current_time: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Continuous local motion; only velocity and yaw rate are fused here.
    odom0: platform/odom/filtered
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Absolute Cartesian position produced from the simulated NavSatFix.
    odom1: platform/odom/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
