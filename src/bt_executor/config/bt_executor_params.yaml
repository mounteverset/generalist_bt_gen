bt_action_server:
  ros__parameters:
    action_name: "/bt_executor/execute_tree"
    tick_frequency: 20
    groot2_port: 1667
    ros_plugins_timeout: 10000
    behavior_trees:
      - "bt_executor/trees"

    # bt_executor custom parameters
    plugin_directories:
      - "robot_actions/lib"
    nav2_action_name: "/navigate_to_pose"
    nav2_follow_gps_waypoints_action_name: "/follow_gps_waypoints"
    nav2_goal_frame_id: "target/map"
    waypoint_marker_topic: "/mission_coordinator/waypoint_markers"
    waypoint_marker_map_frame: "target/map"
    waypoint_marker_gps_frame: "target/odom"
    waypoint_marker_from_ll_service: "/fromLL"
    waypoint_marker_conversion_timeout_ms: 2000
    log_temperature_service_name: "/log_temperature"
    take_photo_image_topic: "/okvis/rgb2/image_raw"
    get_current_pose_pose_topic: "/pose"
    distance_traveled_odom_topic: "/target/odometry/fused"
    get_current_pose_odom_topic: "/target/odometry/fused"
    status_topic: "/mission_coordinator/status_text"
    active_node_topic: "/mission_coordinator/active_subtree"
    enable_debug_logging: false
    auto_restart_on_failure: false
    feedback_rate_hz: 5.0
