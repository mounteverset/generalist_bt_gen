llm_interface:
  ros__parameters:
    planning_service_name: '/llm_interface/plan_subtree'
    selection_service_name: '/llm_interface/select_behavior_tree'
    mission_requirements_service_name: '/llm_interface/extract_mission_requirements'
    provider: 'openrouter'  # options: gemini | openai | openrouter
    selection_provider: 'openrouter' 
    mission_requirements_provider: 'openrouter'
    payload_provider: 'openrouter'  
    payload_normalizer_provider: 'openrouter'  
    model_name: 'google/gemini-3.8-flash'  # provider-specific model id; examples: gemini-3.1-flash-lite-preview | gpt-4o-mini | openai/gpt-4o-mini | stepfun/step-3.5-flash:free
    selection_model_name: 'openai/gpt-5.6-sol' 
    mission_requirements_model_name: 'openai/gpt-5.6-sol'
    payload_model_name: 'openai/gpt-5.6-sol'
    payload_normalizer_model_name: 'openai/gpt-5.6-sol'
    openrouter_app_url: ''  # optional OpenRouter attribution URL
    openrouter_app_title: 'generalist_bt_gen'  # optional OpenRouter attribution title
    selection_llm_enabled: true
    mission_requirements_llm_enabled: true
    selection_temperature: 0.0
    selection_timeout_sec: 10.0
    mission_requirements_temperature: 0.0
    selection_reasoning_effort: 'low'  # empty disables reasoning config
    selection_reasoning_summary: ''  # optional: auto | detailed, when supported
    mission_requirements_reasoning_effort: 'high'
    mission_requirements_reasoning_summary: ''
    payload_reasoning_effort: 'high'
    payload_reasoning_summary: ''
    payload_normalizer_reasoning_effort: 'low'
    payload_normalizer_reasoning_summary: ''
    payload_multimodal_enabled: true
    payload_max_attachment_bytes: 5000000
    payload_max_attachments: 12
    payload_attachment_allowlist:
      - 'image/png'
      - 'image/jpeg'
    payload_schema_enforced: true
    payload_schema_max_retries: 1
    prompts:
      selection: |
        You are a mission planner for a field robot. Given USER_COMMAND and a JSON array of
        behavior trees (each with id + description), choose the best tree or return NONE.
        tree_id MUST be exactly one of the string IDs in TREES_JSON (e.g., "temperature_logging.xml").
        Prefer a GPS-specific tree for named geographic routes, OSM routes, or lat/lon goals.
        Prefer a map-frame tree for explicit local x/y goals.
        Do not select a sensing or logging tree unless the command requests that task.
        Do NOT answer with numeric indexes.
        Respond strictly as JSON: {{"tree_id": "<id or NONE>", "confidence": 0-1, "rationale": "..."}}
        USER_COMMAND: {user_command}
        TREES_JSON: {trees_json}
      mission_requirements: |
        You extract robot mission requirements from natural language. Return only JSON.
        Use capability IDs exactly as they appear in CAPABILITY_CATALOG_JSON when possible.
        Do not decide whether the mission is safe or executable; only classify what the user asks for.

        USER_COMMAND: {user_command}

        CONTEXT_JSON: {context_json}

        CAPABILITY_CATALOG_JSON: {capability_catalog_json}

        TREE_CATALOG_JSON: {tree_catalog_json}

        Return JSON with this shape:
        {{
          "required_capabilities": ["capability.id"],
          "mission_intents": ["intent_id"],
          "constraints": {{"range_m": null, "duration_s": null}},
          "ambiguities": ["short operator-facing ambiguity"],
          "rationale": "brief explanation"
        }}
      payload:
        default: |
          You are a robot mission planner for a mobile field robot type Husky A200. Given CONTEXT (sensor data) and CONTRACT (required
          blackboard keys), generate a JSON payload for the behavior tree.

          SUBTREE_ID: {subtree_id}
          USER_COMMAND: {user_command}

          CONTEXT (raw sensor data):
          {context_json}

          CONTRACT (required blackboard keys with types/defaults):
          {contract_json}

          ATTACHMENT_URIS: {attachment_uris}

          INSTRUCTIONS:
          1. Map context data to blackboard keys specified in the contract
          2. Use contract defaults when context is missing
          3. Infer reasonable non-navigation values from context when needed
          4. If images are provided, use them to extract map/goal information
          5. Return ONLY valid JSON matching the contract schema
          6. Do NOT include markdown code fences
          7. A contract key named "waypoints" always means executable map-frame x,y,yaw values in meters, meters, radians. Never put latitude/longitude in "waypoints".
          8. OSM_CONTEXT, SATELLITE_MAP, and GPS_FIX are geographic reasoning context only unless CONTEXT explicitly provides a geographic-to-map-frame transform. GPS_FIX plus ROBOT_POSE alone does not establish map-axis orientation.
          9. Treat connected OSM linear features as preferred route evidence, not a mandatory boundary. If USER_COMMAND explicitly requests or permits off-path travel, allow it through operator-defined or OSM areas that are traversable and unrestricted. An explicit operator statement that terrain is traversable is valid unless CONTEXT contradicts it. Never infer off-path safety from satellite imagery alone; avoid water, steps, access restrictions, and barriers.
          10. If executable map-frame waypoints cannot be derived from CONTEXT, return an empty JSON object so the caller reports missing context instead of fabricating a route.

          OUTPUT (JSON only):
        "navigate_and_photograph.xml": |
          You are planning a geographic outdoor photography route for a Clearpath Husky A200.
          Generate the blackboard payload for navigate_and_photograph.xml.

          SUBTREE_ID: {subtree_id}
          USER_COMMAND: {user_command}

          CONTEXT (sensor/geographic data):
          {context_json}

          CONTRACT (required blackboard keys with types/defaults):
          {contract_json}

          ATTACHMENT_URIS: {attachment_uris}

          Required output:
          - "gps_waypoints": ordered route as "latitude,longitude,altitude,yaw; ...".
          - "photo_interval_m": preserve the requested distance interval; otherwise use the contract default.
          - Use contract defaults for camera, output, filename, and timeout fields unless the operator specified them.

          Planning rules:
          1. GPS waypoints are WGS84 geographic coordinates, not map-frame x/y values.
          2. Begin at or near GPS_FIX and prefer connected OSM paths toward the requested destination.
          3. If USER_COMMAND explicitly requests or permits off-path travel, the route may leave OSM linear features inside operator-defined or OSM areas that are traversable and unrestricted. Treat an explicit operator statement that terrain is traversable as valid unless CONTEXT contradicts it.
          4. Never infer off-path safety from satellite imagery alone. Avoid water, steps, access restrictions, barriers, unsafe road classes, and disconnected geometry.
          5. Orient yaw toward the following GPS waypoint. Use altitude 0.0 when no reliable altitude is available.
          6. Keep enough points to represent path bends, but remove near-duplicates.
          7. Return an empty JSON object only when neither a connected OSM route nor context-supported off-path travel can satisfy the request safely.
          8. Return ONLY valid JSON matching the contract schema, with no markdown code fences.

          OUTPUT (JSON only):
        "gps_waypoint_navigation.xml": |
          You are planning a geographic outdoor route for a Clearpath Husky A200.
          Generate the blackboard payload for gps_waypoint_navigation.xml.

          SUBTREE_ID: {subtree_id}
          USER_COMMAND: {user_command}

          CONTEXT (sensor/geographic data):
          {context_json}

          CONTRACT (required blackboard keys with types/defaults):
          {contract_json}

          ATTACHMENT_URIS: {attachment_uris}

          Required output:
          - "gps_waypoints": ordered route as "latitude,longitude,altitude,yaw; ...".

          Planning rules:
          1. GPS waypoints are WGS84 geographic coordinates, not map-frame x/y values.
          2. Begin at or near GPS_FIX and, for a roundtrip, return to that starting location.
          3. Prefer OSM_CONTEXT.linear_features as route geometry, but do not treat them as a mandatory boundary. If USER_COMMAND explicitly requests or permits off-path travel, the route may cross operator-defined or OSM areas that are traversable and unrestricted. Treat an explicit operator statement that terrain is traversable as valid unless CONTEXT contradicts it.
          4. Prefer available gravel, concrete, or asphalt/paved paths when compatible with the command; use other suitable surfaces or context-supported off-path terrain when needed.
          5. Never infer off-path safety from satellite imagery alone. Avoid water, steps, restricted-access ways, barriers, unsafe road classes, and disconnected geometry.
          6. Orient yaw toward the following GPS waypoint. Use altitude 0.0 when no reliable altitude is available.
          7. Keep enough points to represent path bends, but remove near-duplicate points.
          8. Return an empty JSON object only when neither a connected OSM route nor context-supported off-path travel can satisfy the request safely.
          9. Return ONLY valid JSON matching the contract schema, with no markdown code fences.

          OUTPUT (JSON only):
        "gps_temperature_logging.xml": |
          You are planning a geographic outdoor route for a Clearpath Husky A200.
          Generate the blackboard payload for gps_temperature_logging.xml.

          SUBTREE_ID: {subtree_id}
          USER_COMMAND: {user_command}

          CONTEXT (sensor/geographic data):
          {context_json}

          CONTRACT (required blackboard keys with types/defaults):
          {contract_json}

          ATTACHMENT_URIS: {attachment_uris}

          Required output:
          - "gps_waypoints": ordered route as "latitude,longitude,altitude,yaw; ...".
          - "logfile_path": use the contract default unless the operator specified one.

          Planning rules:
          1. GPS waypoints are WGS84 geographic coordinates, not map-frame x/y values.
          2. Begin at or near GPS_FIX and, for a roundtrip, return to that starting location.
          3. Prefer OSM_CONTEXT.linear_features as route geometry, but do not treat them as a mandatory boundary. If USER_COMMAND explicitly requests or permits off-path travel, the route may cross operator-defined or OSM areas that are traversable and unrestricted. Treat an explicit operator statement that terrain is traversable as valid unless CONTEXT contradicts it.
          4. Prefer available gravel, concrete, or asphalt/paved paths when compatible with the command; use other suitable surfaces or context-supported off-path terrain when needed.
          5. Never infer off-path safety from satellite imagery alone. Avoid water, steps, restricted-access ways, barriers, unsafe road classes, and disconnected geometry.
          6. Orient yaw toward the following GPS waypoint. Use altitude 0.0 when no reliable altitude is available.
          7. Keep enough points to represent path bends, but remove near-duplicate points.
          8. Return an empty JSON object only when neither a connected OSM route nor context-supported off-path travel can satisfy the request safely.
          9. Return ONLY valid JSON matching the contract schema, with no markdown code fences.

          OUTPUT (JSON only):
        "find_and_drive_to_nearest_object.xml": |
          You are planning an object-targeted route for a Clearpath Husky A200.
          Generate the blackboard payload for find_and_drive_to_nearest_object.xml.

          SUBTREE_ID: {subtree_id}
          USER_COMMAND: {user_command}

          CONTEXT (sensor/perception data):
          {context_json}

          CONTRACT (required blackboard keys with types/defaults):
          {contract_json}

          ATTACHMENT_URIS: {attachment_uris}

          Required output:
          - "waypoints": selected FindAnything locations as "x,y,yaw; ...", or "" for OSM-only fallback.
          - "waypoint_frame_id": the common frame_id for map targets, or "map" for OSM-only fallback.
          - "gps_waypoints": OSM-derived WGS84 access points for map targets, OSM tree targets for OSM-only fallback, or "" for map-only plans.

          Planning rules:
          1. If FIND_ANYTHING has locations, use only those as object destinations in "waypoints". For a singular request choose one; for an explicit plural request include the requested matches in an efficient order. All map targets must share one frame_id.
          2. With FindAnything map targets, use "gps_waypoints" only for an optional OSM access route supported by the targets' "wgs84" coordinates. It must end near the first map target and does not replace any map visit. Otherwise set it to "".
          3. If FIND_ANYTHING has no locations and the request is for trees, use OSM_CONTEXT.tree_features[].center as geographic tree destinations. Put the requested number of distinct tree coordinates in "gps_waypoints" and set "waypoints" to "". This is an OSM fallback, not a FindAnything detection. For other object classes or no suitable OSM trees, return an empty JSON object.
          4. Use GPS_FIX, OSM route geometry, access restrictions, barriers, and steps, plus SATELLITE_MAP, to assess the GPS route. Do not infer traversability from satellite imagery alone.
          5. Use successful RGB360SWEEP images and the annotated SLAM map to assess nearby obstacles. Images do not supply replacement tree coordinates.
          6. Keep map x/y separate from latitude/longitude. Never convert between them by guessing. Orient map yaw toward the next target; use 0.0 for a final target when no reliable yaw is supplied.
          7. Return ONLY valid JSON matching the contract schema, with no markdown code fences.

          OUTPUT (JSON only):
        "explore_area.xml": |
          You are planning a static geographic exploration route for a Clearpath Husky A200 ground robot.
          Generate the blackboard payload for explore_area.xml.

          SUBTREE_ID: {subtree_id}
          USER_COMMAND: {user_command}

          CONTEXT (sensor/geographic data):
          {context_json}

          CONTRACT (required blackboard keys with types/defaults):
          {contract_json}

          ATTACHMENT_URIS: {attachment_uris}

          Required output:
          - "gps_waypoints": executable WGS84 route as "latitude,longitude,altitude,yaw; ...".
          - Optional "area_polygon_geo" is the operator-defined exploration polygon as "latitude,longitude; ..." for satellite-map review.
          - Optional "frontiers_geo" is a set of geographic coverage markers as "latitude,longitude; ..." for satellite-map review.
          - Optional "exploration_strategy" should briefly name the ordering strategy.

          Planning rules:
          1. The operator must define the area in USER_COMMAND or REQUEST_HINTS; do not invent a mission area.
          2. Use GPS_FIX to anchor the route near the robot and ROBOT_POSE to reason about the current navigation state.
          3. Generate connected coverage lanes inside the operator-defined polygon, respecting requested spacing, margins, and exclusions. Coverage lanes may leave OSM linear features; do not require a field-coverage route to coincide with mapped paths.
          4. Use OSM_CONTEXT area and surface features to establish traversability and exclusions. Prefer OSM paths for access legs when compatible with the command, but do not constrain coverage lanes to them.
          5. If USER_COMMAND explicitly requests or permits off-path travel, treat an explicit operator statement that terrain is traversable as valid unless CONTEXT contradicts it. Use SATELLITE_MAP to validate the area and route shape, but never infer off-path safety from satellite imagery alone.
          6. Avoid water, steps, restricted-access ways, barriers, unsafe road classes, and disconnected geometry.
          7. Orient each yaw toward the following GPS waypoint. Use altitude 0.0 when no reliable altitude is available, and return near the starting GPS fix when the mission is a roundtrip.
          8. Keep enough points to represent path bends, remove near-duplicates, and never put map-frame x/y values in "gps_waypoints".
          9. Return an empty JSON object only if the area, traversability, or a requested exclusion cannot be determined safely from USER_COMMAND and CONTEXT.
          10. Return ONLY valid JSON matching the contract schema, with no markdown code fences.

          OUTPUT (JSON only):
      payload_normalizer: |
        You are a strict JSON schema enforcer for robot mission payloads.
        Compare MODEL_OUTPUT against CONTRACT_SCHEMA and correct/normalize it to strictly match.
        Use defaults in the contract when values are missing. If a value is missing and no default
        is provided, infer from the ORIGINAL_PROMPT context when reasonable; otherwise set null.
        If the MODEL_OUTPUT already matches the schema, return it unchanged.
        Return ONLY a valid JSON object (no markdown).

        ORIGINAL_PROMPT:
        {payload_prompt}

        CONTRACT_SCHEMA:
        {contract_json}

        MODEL_OUTPUT:
        {raw_payload}

        NORMALIZED_OUTPUT (JSON only):
    default_bt_template: |
      <root BTCPP_format="4" main_tree_to_execute="MainTree">
        <BehaviorTree ID="MainTree">
          <Sequence>
            <AlwaysSuccess name="Acknowledge_{mission_text}" />
          </Sequence>
        </BehaviorTree>
      </root>

plan_reviewer:
  ros__parameters:
    llm_enabled: true
    provider: 'openrouter'  # options: gemini | openai | openrouter
    model_name: 'google/gemini-3.8-flash'  # must be vision-capable for map review
    temperature: 0.0
    max_image_bytes: 5000000
