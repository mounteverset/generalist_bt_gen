# Tree Metadata Configuration
# Defines context requirements and blackboard contracts for behavior trees

trees:
  - id: "temperature_logging.xml"
    description: "Navigate through waypoints and log temperature at each waypoint."
    mission_intents:
      - "navigate_waypoints"
      - "log_temperature"
    required_capabilities:
      - "localization.gps"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "sensing.temperature"
      - "payload.parse_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
    context_requirements: [ROBOT_POSE, GPS_FIX, ANNOTATED_SLAM_MAP_IMAGE, OSM_CONTEXT, SATELLITE_MAP] #RGB360SWEEP
    blackboard_contract:
      waypoints:
        type: "string"
        required: true
        default: ""
        schema:
          type: "string"
          description: "Semicolon-separated waypoints, each formatted as 'x,y,yaw' (meters, meters, radians)."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "1.0,2.0,0.0; 3.5,4.2,1.57"
      logfile_path:
        type: "string"
        required: false
        default: "/tmp/temperature_log.txt"

  - id: "gps_waypoint_navigation.xml"
    description: "Follow a geographic OSM/GPS route without adding an unrelated sensing task."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
    required_capabilities:
      - "localization.gps"
      - "localization.odometry"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
      requires_target_area_or_route: true
    context_requirements:
      - ROBOT_POSE
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated geographic route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"

  - id: "gps_temperature_logging.xml"
    description: "Follow a geographic OSM/GPS route and log temperature after reaching each GPS waypoint."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
      - "log_temperature"
    required_capabilities:
      - "localization.gps"
      - "localization.odometry"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "sensing.temperature"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
      requires_target_area_or_route: true
    context_requirements:
      - ROBOT_POSE
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated geographic route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"
      logfile_path:
        type: "string"
        required: false
        default: "/tmp/gps_temperature_log.txt"

  - id: "blueboat_temperature_logging.xml"
    description: "Navigate a BlueBoat through WGS84 waypoints using MAVROS global setpoints, lower the temperature probe, log water temperature, and raise the probe at each station."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
      - "log_temperature"
    required_capabilities:
      - "locomotion.water_surface"
      - "control.guided_mode"
      - "control.arming"
      - "actuation.probe_depth"
      - "localization.gps"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "sensing.temperature"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 1000
      requires_target_area_or_route: true
    context_requirements:
      - GPS_FIX
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated WGS84 route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"
      logfile_path:
        type: "string"
        required: false
        default: "/tmp/blueboat_water_temperature.txt"
      measurement_depth_cm:
        type: "int"
        required: false
        default: 20
        schema:
          type: "integer"
          minimum: 0
          maximum: 200
      raise_depth_cm:
        type: "int"
        required: false
        default: 0
      acceptance_radius_m:
        type: "double"
        required: false
        default: 3.0
      guided_mode_timeout_sec:
        type: "double"
        required: false
        default: 5.0
      gps_fix_timeout_sec:
        type: "double"
        required: false
        default: 10.0
      station_hold_ms:
        type: "int"
        required: false
        default: 10000

  - id: "navigate_and_photograph.xml"
    description: "Navigate to waypoints and take photos at regular intervals"
    mission_intents:
      - "navigate_waypoints"
      - "photograph_route"
      - "document_area"
    required_capabilities:
      - "locomotion.ground"
      - "navigation.waypoints"
      - "sensing.rgb_image"
      - "localization.gps"
      - "localization.odometry"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
      requires_target_area_or_route: true
    context_requirements: [ROBOT_POSE, GPS_FIX]
    blackboard_contract:
      waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated waypoints, each formatted as 'x,y,yaw' (meters, meters, radians)."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "0.0,0.0,0.0; 5.0,1.0,0.0"
      photo_interval_m:
        type: "double"
        required: false
        default: 5.0
      camera_topic:
        type: "string"
        required: false
        default: "/okvis/rgb2/image_raw"
      odom_topic:
        type: "string"
        required: false
        default: "/target/odometry/fused"
      photo_output_directory:
        type: "string"
        required: false
        default: "/tmp/robot_actions/photos"
      photo_filename_prefix:
        type: "string"
        required: false
        default: "mission_photo"
      image_timeout_ms:
        type: "int"
        required: false
        default: 1000
      odom_timeout_ms:
        type: "int"
        required: false
        default: 50

  - id: "find_and_drive_to_nearest_object.xml"
    description: "Plan map-frame waypoints from FindAnything object-location context and navigate to the selected match or matches."
    mission_intents:
      - "find_object"
      - "navigate_to_object"
    required_capabilities:
      - "locomotion.ground"
      - "navigation.waypoints"
      - "localization.odometry"
      - "mapping.slam"
      - "sensing.rgb_image"
      - "perception.object_location"
      - "payload.parse_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
    context_requirements:
      - ROBOT_POSE
      - ANNOTATED_SLAM_MAP_IMAGE
      - FIND_ANYTHING
    blackboard_contract:
      waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "FindAnything-derived map-frame destinations, each formatted as 'x,y,yaw' (meters, meters, radians)."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "1.0,2.0,0.0; 3.5,4.2,1.57"
      waypoint_frame_id:
        type: "string"
        required: false
        default: "map"

  - id: "explore_area.xml"
    description: "Explore an operator-defined ground area by following a precomputed map-frame coverage route."
    mission_intents:
      - "explore_area"
      - "survey_area"
    required_capabilities:
      - "localization.odometry"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "mapping.slam"
      - "payload.parse_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_radius_m: 50
      requires_target_area: true
    context_requirements:
      - ROBOT_POSE
      - ANNOTATED_SLAM_MAP_IMAGE
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
    blackboard_contract:
      waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated map-frame waypoints, each formatted as 'x,y,yaw' in metres and radians."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "3.0,3.0,0.0; 27.0,3.0,0.0"
      area_polygon:
        type: "string"
        required: false
        schema:
          type: "string"
          description: "Optional operator-defined map-frame polygon as 'x,y' vertices."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?){2,}$'
          examples:
            - "0.0,0.0; 30.0,0.0; 30.0,20.0; 0.0,20.0"
      frontiers:
        type: "string"
        required: false
        schema:
          type: "string"
          description: "Optional map-frame exploration or coverage points as 'x,y,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "3.0,3.0,0.0; 27.0,3.0,0.0"
      exploration_strategy:
        type: "string"
        required: false
        default: "frontier_coverage"
