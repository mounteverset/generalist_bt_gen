# Tree Metadata Configuration
# Defines context requirements and blackboard contracts for behavior trees

trees:
  - id: "temperature_logging.xml"
    description: "Navigate through waypoints and log temperature at each waypoint."
    mission_intents:
      - "navigate_waypoints"
      - "log_temperature"
    required_capabilities:
      - "localization.gps"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "sensing.temperature"
      - "payload.parse_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
    context_requirements: [ROBOT_POSE, GPS_FIX, ANNOTATED_SLAM_MAP_IMAGE, OSM_CONTEXT, SATELLITE_MAP] #RGB360SWEEP
    blackboard_contract:
      waypoints:
        type: "string"
        required: true
        default: ""
        schema:
          type: "string"
          description: "Semicolon-separated waypoints, each formatted as 'x,y,yaw' (meters, meters, radians)."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "1.0,2.0,0.0; 3.5,4.2,1.57"
      logfile_path:
        type: "string"
        required: false
        default: "/tmp/temperature_log.txt"

  - id: "gps_waypoint_navigation.xml"
    description: "Follow a geographic OSM/GPS route without adding an unrelated sensing task."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
    required_capabilities:
      - "localization.gps"
      - "localization.odometry"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
      requires_target_area_or_route: true
    context_requirements:
      - ROBOT_POSE
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated geographic route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"

  - id: "gps_temperature_logging.xml"
    description: "Follow a geographic OSM/GPS route and log temperature after reaching each GPS waypoint."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
      - "log_temperature"
    required_capabilities:
      - "localization.gps"
      - "localization.odometry"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "sensing.temperature"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
      requires_target_area_or_route: true
    context_requirements:
      - ROBOT_POSE
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated geographic route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"
      logfile_path:
        type: "string"
        required: false
        default: "/tmp/gps_temperature_log.txt"

  - id: "blueboat_temperature_logging.xml"
    description: "Navigate a BlueBoat through WGS84 waypoints using MAVROS global setpoints, lower the temperature probe, log water temperature, and raise the probe at each station."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
      - "log_temperature"
    required_capabilities:
      - "locomotion.water_surface"
      - "control.guided_mode"
      - "control.arming"
      - "actuation.probe_depth"
      - "localization.gps"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "sensing.temperature"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 1000
      requires_target_area_or_route: true
    context_requirements:
      - GPS_FIX
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated WGS84 route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"
      logfile_path:
        type: "string"
        required: false
        default: "/tmp/blueboat_water_temperature.txt"
      measurement_depth_cm:
        type: "int"
        required: false
        default: 20
        schema:
          type: "integer"
          minimum: 0
          maximum: 200
      raise_depth_cm:
        type: "int"
        required: false
        default: 0
      acceptance_radius_m:
        type: "double"
        required: false
        default: 3.0
      guided_mode_timeout_sec:
        type: "double"
        required: false
        default: 5.0
      gps_fix_timeout_sec:
        type: "double"
        required: false
        default: 10.0
      station_hold_ms:
        type: "int"
        required: false
        default: 10000

  - id: "navigate_and_photograph.xml"
    description: "Follow geographic GPS waypoints and take photos at regular intervals."
    mission_intents:
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
      - "photograph_route"
      - "document_area"
    required_capabilities:
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "sensing.rgb_image"
      - "localization.gps"
      - "localization.odometry"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
      requires_target_area_or_route: true
    context_requirements: [ROBOT_POSE, GPS_FIX, OSM_CONTEXT, SATELLITE_MAP]
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated geographic route. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"
      photo_interval_m:
        type: "double"
        required: false
        default: 5.0
      camera_topic:
        type: "string"
        required: false
        default: "/okvis/rgb2/image_raw"
      photo_output_directory:
        type: "string"
        required: false
        default: "/tmp/robot_actions/photos"
      photo_filename_prefix:
        type: "string"
        required: false
        default: "mission_photo"
      image_timeout_ms:
        type: "int"
        required: false
        default: 1000
      odom_timeout_ms:
        type: "int"
        required: false
        default: 50

  - id: "find_and_drive_to_nearest_object.xml"
    description: "Visit FindAnything map-frame object targets, or OSM GPS tree targets when FindAnything is unavailable."
    mission_intents:
      - "find_object"
      - "navigate_to_object"
    required_capabilities:
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "localization.gps"
      - "localization.odometry"
      - "mapping.slam"
      - "sensing.rgb_image"
      - "perception.object_location"
      - "payload.parse_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_range_m: 5000
    context_requirements:
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
      - RGB360SWEEP
      - ROBOT_POSE
      - ANNOTATED_SLAM_MAP_IMAGE
      - FIND_ANYTHING
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        default: ""
        schema:
          type: "string"
          description: "OSM-derived WGS84 access route when map targets exist, or OSM tree targets when FindAnything is unavailable; empty for map-only plans."
      waypoints:
        type: "string"
        required: true
        default: ""
        schema:
          type: "string"
          description: "FindAnything-derived map-frame destinations as 'x,y,yaw'; empty only for OSM GPS tree fallback."
          pattern: '^$|^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "1.0,2.0,0.0; 3.5,4.2,1.57"
      waypoint_frame_id:
        type: "string"
        required: false
        default: "map"

  - id: "explore_area.xml"
    description: "Explore an operator-defined ground area using OSM/satellite context and a precomputed geographic GPS coverage route."
    mission_intents:
      - "explore_area"
      - "survey_area"
      - "navigate_waypoints"
      - "navigate_gps_waypoints"
      - "geographic_route"
    required_capabilities:
      - "localization.gps"
      - "localization.odometry"
      - "locomotion.ground"
      - "navigation.waypoints"
      - "navigation.gps_waypoints"
      - "mapping.slam"
      - "payload.parse_gps_waypoints"
    unsupported_requirements:
      - "locomotion.flight"
      - "sensing.thermal_image"
      - "manipulation.pick_place"
      - "sampling.soil"
    selection_constraints:
      max_radius_m: 50
      requires_target_area: true
    context_requirements:
      - ROBOT_POSE
      - GPS_FIX
      - OSM_CONTEXT
      - SATELLITE_MAP
    blackboard_contract:
      gps_waypoints:
        type: "string"
        required: true
        schema:
          type: "string"
          description: "Semicolon-separated geographic route sent as one Nav2 FollowGPSWaypoints goal. Each waypoint is 'latitude,longitude,yaw' or 'latitude,longitude,altitude,yaw'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2}(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(,-?\d+(\.\d+)?){0,2})*$'
          examples:
            - "48.2848,11.6077,0.0; 48.2851,11.6074,1.57"
      area_polygon_geo:
        type: "string"
        required: false
        schema:
          type: "string"
          description: "Optional operator-defined geographic polygon as 'latitude,longitude' vertices."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?){2,}$'
          examples:
            - "48.2848,11.6077; 48.2849,11.6080; 48.2846,11.6082"
      frontiers_geo:
        type: "string"
        required: false
        schema:
          type: "string"
          description: "Optional geographic exploration or coverage points as 'latitude,longitude'."
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s*;\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?)*$'
          examples:
            - "48.2848,11.6077; 48.2851,11.6074"
      exploration_strategy:
        type: "string"
        required: false
        default: "gps_coverage_waypoints"
